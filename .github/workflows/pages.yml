name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/hopex-artist-website-vr572a]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # enablement turns Pages on for the repo if it is not already,
      # so no manual switch in Settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Vite output only — publishing the repo root here would serve the
      # TypeScript sources instead of the compiled app.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4
