<!-- Non-blocking: as a plain stylesheet this held first paint for as long as
     fonts.googleapis.com took to answer (12.8s when unreachable, 260ms when it
     answered). media="print" + onload paints immediately in the fallback face. -->
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:wght@400;700&display=swap">
<noscript>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:wght@400;700&display=swap">
</noscript>

<link rel="stylesheet" href="assets/css/style.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "HOPEX",
  "genre": ["Electronic", "Trap", "Future Bass"],

<!-- ══════════════════════ ATMOSPHERE ══════════════════════
     Glowing orbs drifting underneath, sparkles twinkling on top. -->
<div class="sky" aria-hidden="true">
  <span class="orb orb--1"></span>
  <span class="orb orb--2"></span>
  <span class="orb orb--3"></span>
  <span class="orb orb--4"></span>
  <div class="sparkles" id="sparkles"></div>
</div>

<button class="theme" type="button" id="theme" aria-pressed="false" aria-label="Switch to light theme">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
    <circle cx="12" cy="12" r="4"/>
  </svg>
</button>

<!-- ══════════════════════ THE PAGE — all of it ══════════════════════ -->
<main class="page">

  <img class="mark" src="assets/img/hopex-mark.webp" alt=""
       width="320" height="320" fetchpriority="high" decoding="async">

  <h1 class="wordmark">
    <span class="ltr" style="--i:0">H</span><span class="ltr" style="--i:1">O</span><span class="ltr" style="--i:2">P</span><span class="ltr" style="--i:3">E</span><span class="ltr" style="--i:4">X</span>
  </h1>

  <p class="tagline">Producer &amp; DJ &mdash; Amsterdam</p>

  <!-- Icons only. Names live in aria-label and the hover tooltip. -->
  <ul class="links" id="links" aria-label="Listen and follow"></ul>

  <a class="mail" id="mail" href="#"></a>

</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
